name: 🛰️ Sentinel-1 Tank Monitor Automatic Run

on:
  schedule:
    # 💡 実行日は「月の」6日・12日・18日・24日・30日になります（cronの `*/6` は日付の間隔ではなく日付のステップ指定です）。
    #     ※ 6日ごとの間隔（例: 1日→7日→13日）は cron では表現できないため注意してください。
    - cron: '0 0 */6 * *'
  workflow_dispatch:
    # 💡 GitHubの画面から「今すぐ手動で実行」できるボタンを出現させる設定

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🔑 Authenticate Google Earth Engine
        env:
          GEE_KEY: ${{ secrets.EARTH_ENGINE_CREDENTIALS }}
        run: |
          # 登録された秘密鍵シークレットをローカルのJSONファイルに書き出す
          printf '%s' "$GEE_KEY" > gee_key.json
          # Google標準の認証環境変数としてパスを登録
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gee_key.json" >> $GITHUB_ENV

      - name: ⚙️ Run Main Pipeline via run.bash
        env:
          # 💡 ここがポイント：JSON鍵の中からGoogleの「Project ID」を自動でパースして環境変数に注入します
          GEE_PROJECT_ID: ${{ fromJson(secrets.EARTH_ENGINE_CREDENTIALS).project_id }}
        run: |
          # スクリプトに実行権限を与えてから、Bashで実行する
          chmod +x ./run.bash
          ./run.bash

      - name: 🚀 Commit and Push updated data/plots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@github.com"
          
          # 更新されたCSVデータとPNGグラフをステージング（ファイルが無ければ無視する）
          shopt -s nullglob || true
          files=(data/*.csv)
          if [ ${#files[@]} -gt 0 ]; then
            git add "${files[@]}"
          fi
          files=(plots/*.png)
          if [ ${#files[@]} -gt 0 ]; then
            git add "${files[@]}"
          fi
          
          # 変更がある場合のみコミットしてGitHubへ書き戻す（無限ループ防止）
          if ! git diff --cached --quiet; then
            git commit -m "🔄 [Automated] Update Sentinel-1 tank data and plots [$(date +'%Y-%m-%d')]"
            git push
          else
            echo "No changes in data or plots. Skipping push."
          fi