name: 🛰️ Sentinel-1 Tank Monitor Automatic Run

on:
  schedule:
    # 💡 実行日は「月の」6日・12日・18日・24日・30日になります（cronの `*/6` は日付の間隔ではなく日付のステップ指定です）。
    #     ※ 6日ごとの間隔（例: 1日→7日→13日）は cron では表現できないため注意してください。
    - cron: '0 0 */6 * *'
  workflow_dispatch:
    # 💡 GitHubの画面から「今すぐ手動で実行」できるボタンを出現させる設定

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🔑 Authenticate Google Earth Engine
        env:
          GEE_KEY: ${{ secrets.EARTH_ENGINE_CREDENTIALS }}
        run: |
          # 登録された秘密鍵シークレットをローカルのJSONファイルに書き出す
          printf '%s' "$GEE_KEY" > gee_key.json
          # Google標準の認証環境変数としてパスを登録
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gee_key.json" >> $GITHUB_ENV

      - name: ⚙️ Run Main Pipeline via run.bash
        env:
          # 💡 ここがポイント：JSON鍵の中からGoogleの「Project ID」を自動でパースして環境変数に注入します
          GEE_PROJECT_ID: ${{ fromJson(secrets.EARTH_ENGINE_CREDENTIALS).project_id }}
        run: |
          # スクリプトに実行権限を与えてから、Bashで実行する
          chmod +x ./run.bash
          ./run.bash

      - name: 🌐 Deploy directly to GitHub Pages (gh-pages branch)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@github.com"

          # 1. 成果物（dataとplots）を一時的に安全な場所に退避
          mkdir -p /tmp/artifacts
          cp -r data plots /tmp/artifacts/

          # 2. シンプルなダッシュボードHTMLを自動生成
          cat > /tmp/artifacts/index.html <<-'EOF'
          <html>
          <head>
            <meta charset="utf-8">
            <title>Sentinel-1 Tank Monitor</title>
            <style>body{font-family:system-ui, sans-serif; margin:2rem;} img{max-width:100%; height:auto; border:1px solid #ddd; margin-bottom:1.5rem;} hr{margin:2rem 0;}</style>
          </head>
          <body>
            <h1>🛰️ Sentinel-1 Tank Monitor</h1>
            <p>最新の生成画像を以下に表示します。</p>
          EOF
          shopt -s nullglob
          for img in /tmp/artifacts/plots/*.png; do
            name=$(basename "$img")
            echo "  <h2>$name</h2>" >> /tmp/artifacts/index.html
            echo "  <img src=\"plots/$name\" alt=\"$name\">" >> /tmp/artifacts/index.html
            echo "  <hr>" >> /tmp/artifacts/index.html
          done
          cat >> /tmp/artifacts/index.html <<-'EOF'
          </body>
          </html>
          EOF

          # 3. gh-pages ブランチを強制的にまっさらな状態で作る
          git fetch origin
          git checkout --orphan gh-pages
          git rm -rf .

          # 4. 退避していたデータと画像、HTMLだけを配置
          cp -r /tmp/artifacts/* .

          # 5. gh-pages ブランチにのみコミットして強制プッシュ
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "🔄 [Automated Web Deploy] Update data and dashboard [$(date +'%Y-%m-%d')]"
            git push origin gh-pages --force
          else
            echo "変更なし。スキップします。"
          fi
