name: 🛰️ Sentinel-1 Tank Monitor Automatic Run

on:
  schedule:
    # 💡 実行日は「月の」6日・12日・18日・24日・30日になります（cronの `*/6` は日付の間隔ではなく日付のステップ指定です）。
    #     ※ 6日ごとの間隔（例: 1日→7日→13日）は cron では表現できないため注意してください。
    # - cron: '0 0 */6 * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    # 💡 GitHubの画面から「今すぐ手動で実行」できるボタンを出現させる設定

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🔑 Authenticate Google Earth Engine
        env:
          GEE_KEY: ${{ secrets.EARTH_ENGINE_CREDENTIALS }}
        run: |
          # GEEライブラリが最優先で探しにいく公式フォルダを作成
          mkdir -p ~/.config/earthengine
          
          # シークレットのJSONテキストを保存
          printf '%s' "$GEE_KEY" > gee_key.json
          
          # 💡 【ここが重要！】Googleの公式CLIツールを使って、Actions環境に「正規の認証」を強制的にバインドします
          gcloud auth activate-service-account --key-file=gee_key.json
          
          # 従来の環境変数用にもパスを登録（安全装置）
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gee_key.json" >> $GITHUB_ENV


      - name: ⚙️ Run Main Pipeline via run.bash
        env:
          # 💡 ここがポイント：JSON鍵の中からGoogleの「Project ID」を自動でパースして環境変数に注入します
          GEE_PROJECT_ID: ${{ fromJson(secrets.EARTH_ENGINE_CREDENTIALS).project_id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # スクリプトに実行権限を与えてから、Bashで実行する
          chmod +x ./run.bash
          ./run.bash

      - name: 🌐 Deploy directly to GitHub Pages (gh-pages branch)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@github.com"

          # 1. 成果物（data, plots, index.html）を一時的に安全な場所に退避
          mkdir -p /tmp/artifacts
          cp -r data plots index.html /tmp/artifacts/
          rm -f gee_key.json

          # 2. gh-pages ブランチを強制的にまっさらな状態で作る
          git fetch origin
          git checkout --orphan gh-pages
          git rm -rf .

          # 3. 退避していたデータと画像、生成済みHTMLだけを配置
          cp -r /tmp/artifacts/* .

          # 4. gh-pages ブランチにのみコミットして強制プッシュ
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "🔄 [Automated Web Deploy] Update data and dashboard [$(date +'%Y-%m-%d')]"
            git push origin gh-pages --force
          else
            echo "変更なし。スキップします。"
          fi
